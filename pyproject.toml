[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "tests/fixtures"]

[tool.ruff.lint]
# Start with correctness checks that should never be waived. Broader style rules
# can be enabled incrementally without making the first CI run cosmetic-only.
select = ["E9", "F63", "F7", "F82"]
