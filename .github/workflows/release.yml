name: Release macOS builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

      - name: Create isolated build environment
        run: python -m venv .build-venv

      - name: Build application
        run: PIP_ONLY_BINARY=cryptography PYTHON_BIN=.build-venv/bin/python ./scripts/build_macos_app.sh

      - name: Apply deterministic ad-hoc signature
        run: codesign --force --deep --sign - dist/AegisScan.app

      - name: Verify architecture and version
        shell: bash
        run: |
          executable="dist/AegisScan.app/Contents/MacOS/AegisScan"
          release_version="${GITHUB_REF_NAME#v}"
          actual_arch="$(lipo -archs "$executable")"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/AegisScan.app/Contents/Info.plist)"
          bundle_icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/AegisScan.app/Contents/Info.plist)"

          echo "Expected architecture: $TARGET_ARCH"
          echo "Actual architecture:   $actual_arch"
          echo "Expected version:      $release_version"
          echo "Bundle version:        $bundle_version"
          echo "Bundle icon:           $bundle_icon"

          if [[ "$actual_arch" != "$TARGET_ARCH" ]]; then
            echo "Built executable architecture does not match the release asset name" >&2
            exit 1
          fi
          if [[ "$bundle_version" != "$release_version" ]]; then
            echo "Bundle version does not match the release tag" >&2
            exit 1
          fi
          if [[ "$bundle_icon" != "AegisScan.icns" ]] || [[ ! -f "dist/AegisScan.app/Contents/Resources/$bundle_icon" ]]; then
            echo "AegisScan application icon is missing from the bundle" >&2
            exit 1
          fi

      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 dist/AegisScan.app

      - name: Run packaged self-test
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen dist/AegisScan.app/Contents/MacOS/AegisScan --self-test 2>&1 | tee self-test.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" -ne 0 ]]; then
            # GitHub annotations are compact, so retain the exception at the
            # end of the traceback instead of its less useful import preamble.
            message="$(tail -c 3500 self-test.log | tr '\n' ' ')"
            echo "::error title=Packaged self-test failed::$message"
            exit "$result"
          fi

      - name: Package release asset
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          asset="AegisScan-${release_version}-macos-${TARGET_ARCH}.zip"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/AegisScan.app "release/$asset"
          cd release
          shasum -a 256 "$asset" > "$asset.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: AegisScan-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: |
        Native Intel and Apple Silicon beta builds of AegisScan.

        Requirements:
        - macOS 12 or newer
        - Semgrep available on the system
        - A Gemini API key

        These beta bundles are ad-hoc signed and are not Apple-notarized. Findings and generated fixes require human review.
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AegisScan ${release_version} Beta" \
            --notes "$RELEASE_NOTES" \
            --prerelease \
            --verify-tag
