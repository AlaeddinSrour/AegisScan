name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m compileall -q src aegisscan_app.py
      - run: python -m ruff check src tests aegisscan_app.py
      - run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70

  package-smoke-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Create isolated build environment
        run: python -m venv .build-venv
      - name: Build macOS application
        run: PIP_ONLY_BINARY=cryptography PYTHON_BIN=.build-venv/bin/python ./scripts/build_macos_app.sh
      - name: Verify packaged application
        shell: bash
        run: |
          set -euo pipefail
          executable="dist/AegisScan.app/Contents/MacOS/AegisScan"
          expected_version="$(python -c 'from src import __version__; print(__version__)')"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/AegisScan.app/Contents/Info.plist)"
          test -x "$executable"
          test "$bundle_version" = "$expected_version"
          codesign --verify --deep --strict --verbose=2 dist/AegisScan.app
          QT_QPA_PLATFORM=offscreen "$executable" --self-test
      - name: Package CI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          asset="release/AegisScan-ci-${GITHUB_SHA}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/AegisScan.app "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
      - name: Upload macOS application artifact
        uses: actions/upload-artifact@v7
        with:
          name: AegisScan-macos-ci-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
