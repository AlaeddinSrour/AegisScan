      category: security
      cwe: CWE-918
      technology: [csharp, aspnet, dotnet]

  - id: aegisscan.csharp.filesystem-check-then-use
    message: A filesystem existence check is followed by a path operation that may be vulnerable to a TOCTOU race.
    languages: [csharp]
    severity: WARNING
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  if (File.Exists($PATH)) {
                    ...
                  }
              - pattern-either: &csharp_path_operations
                  - pattern: File.Open($PATH, ...)
                  - pattern: File.OpenRead($PATH)
                  - pattern: File.OpenWrite($PATH)
                  - pattern: File.ReadAllText($PATH, ...)
                  - pattern: File.ReadAllTextAsync($PATH, ...)
                  - pattern: File.ReadAllBytes($PATH)
                  - pattern: File.ReadAllBytesAsync($PATH, ...)
                  - pattern: File.Delete($PATH)
                  - pattern: File.Move($PATH, ...)
                  - pattern: File.SetAttributes($PATH, ...)
          - patterns:
              - pattern-inside: |
                  if (Directory.Exists($PATH)) {
                    ...
                  }
              - pattern-either:
                  - pattern: Directory.Delete($PATH, ...)
                  - pattern: Directory.Move($PATH, ...)
                  - pattern: Directory.GetFiles($PATH, ...)
                  - pattern: Directory.GetDirectories($PATH, ...)
    metadata:
      confidence: MEDIUM
      category: security
      cwe: CWE-367
      technology: [csharp, dotnet, filesystem]
