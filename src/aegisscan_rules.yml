          - pattern: $REQ.Form[$KEY]
          - pattern: $REQ.Headers[$KEY]
          - pattern: $REQ.RouteValues[$KEY]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CLIENT.GetAsync($URL, ...)
              - pattern: $CLIENT.PostAsync($URL, ...)
              - pattern: $CLIENT.PutAsync($URL, ...)
              - pattern: $CLIENT.DeleteAsync($URL, ...)
              - pattern: $CLIENT.GetStringAsync($URL, ...)
              - pattern: WebRequest.Create($URL)
              - pattern: WebRequest.CreateHttp($URL)
              - pattern: $CLIENT.DownloadString($URL)
          - focus-metavariable: $URL
    metadata:
